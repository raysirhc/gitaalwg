server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: mymcpapp
  ai:
    mcp:
      server:
        name: mymcpapp
        version: 1.0.0
        #protocol: STREAMABLE
        protocol: STATELESS
        type: SYNC
        stdio: false
        annotation-scanner:
          enabled: true

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"


